<!DOCTYPE html>
<html>
<head>
  <script src="main.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <sp-heading size="S">Everstory 누끼 저장</sp-heading>

  <sp-detail class="hint">
    PSD 컨벤션:<br>
    · 맨 위 = 실루엣<br>
    · 그 아래 모든 레이어 = 누끼 (+보정 레이어 OK)<br>
    · 사이즈 버튼 = 출력 tier (파일명 끝 _XS/_S/_M/_L/_FAM)
  </sp-detail>

  <sp-divider size="m"></sp-divider>

  <sp-button class="tier-btn" data-tier="XS" variant="secondary">XS — 0.75″</sp-button>
  <sp-button class="tier-btn" data-tier="S" variant="cta">S — 1″</sp-button>
  <sp-button class="tier-btn" data-tier="M" variant="secondary">M — 1.5″</sp-button>
  <sp-button class="tier-btn" data-tier="L" variant="secondary">L — 2″</sp-button>
  <sp-button class="tier-btn" data-tier="FAM" variant="secondary">FAM — 2.5″</sp-button>

  <sp-body id="status" class="status"></sp-body>
</body>
</html>
